name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Build universal application and run checks
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GetMyFoto-macOS-universal
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/GetMyFoto-icon.png
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GetMyFoto-macOS-universal
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt release/GetMyFoto-icon.png \
            --title "GetMyFoto $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE-NOTES.md \
            --verify-tag
